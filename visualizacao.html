<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Visualização — Demarcação · IMPA Tech</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <style>
    /* Estilos específicos para prender o grafo debaixo do menu */
    body, html {
      height: 100%;
      margin: 0;
      background-color: var(--bg-color, #0f172a);
    }
    
    .viz-page-container {
      padding-top: 90px; /* Dá espaço para o menu do topo não cobrir o grafo */
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    /* É aqui que deixamos o grafo menor e mais elegante */
    .graph-window {
      width: 90%; /* Ocupa 90% da largura da tela */
      max-width: 1400px; /* Limite máximo para telas gigantes */
      height: 82vh; /* Ocupa 82% da altura da tela */
      border: 1px solid rgba(255, 255, 255, 0.15); /* Bordinha sutil */
      border-radius: 16px; /* Bordas arredondadas */
      overflow: hidden;
      background: #000; /* Fundo preto para combinar com o grafo */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* Sombra elegante */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="brand" aria-label="Demarcação — voltar à home">
      <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="10" cy="16" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <circle cx="22" cy="16" r="5" stroke="#8B2C2C" stroke-width="1.5" fill="none"/>
        <line x1="15" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span>
        <span class="brand__name">Demarcação</span>
        <span class="brand__sub">Um mapa da ciência</span>
      </span>
    </a>
    
    <nav class="nav" data-nav aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="visualizacao.html" aria-current="page">Visualização</a>
      <a href="problema.html">O problema</a>
      <a href="filosofos.html">Filósofos</a>
      <a href="campos.html">Campos</a>
      <a href="metodologia.html">Método</a>
      <a href="equipe.html">Equipe</a>
      <a href="bibliografia.html">Bibliografia</a>
    </nav>
    
    <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema"></button>
    <button class="nav-toggle" data-nav-toggle aria-label="Abrir menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
    </button>
  </div>
</header>

<main class="viz-page-container">
  <div class="graph-window">
    <iframe src="grafo.html" title="Visualização Interativa do Grafo"></iframe>
  </div>
</main>

<script src="js/app.js" defer></script>
</body>
</html>
